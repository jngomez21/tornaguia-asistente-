<svg width="680" height="520" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Arquitectura del sistema Tornaguía Asistente</title>
<desc>Diagrama de capas: Frontend React se comunica con el backend en .NET organizado en Clean Architecture (Api, Application, Domain, Infrastructure), que a su vez depende de PostgreSQL con PostGIS y de la API externa de Mapbox.</desc>
