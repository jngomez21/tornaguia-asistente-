<text x="340" y="242" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5b5b57">Casos de uso, interfaces</text>
</g>

<path d="M340 254 L340 270 L205 270 L205 288" fill="none" stroke="#3d3d3a" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M340 254 L340 270 L475 270 L475 288" fill="none" stroke="#3d3d3a" stroke-width="1" marker-end="url(#arrow)"/>

