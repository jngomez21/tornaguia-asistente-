<text x="340" y="172" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5b5b57">Controllers, Swagger</text>
</g>
<line x1="340" y1="184" x2="340" y2="208" stroke="#3d3d3a" stroke-width="1" marker-end="url(#arrow)"/>

<g>
