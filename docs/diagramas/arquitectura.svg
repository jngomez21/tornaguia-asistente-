<text x="340" y="46" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#3d3d3a">Frontend</text>
<text x="340" y="62" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5b5b57">React + Vite + TS</text>
</g>
<line x1="340" y1="74" x2="340" y2="138" stroke="#3d3d3a" stroke-width="1" marker-end="url(#arrow)"/>

